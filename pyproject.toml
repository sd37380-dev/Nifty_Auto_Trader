[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-autonomous-trader"
version = "0.1.0"
description = "Autonomous AI Trading Research and Paper-Trading Software based on Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NIFTY Autonomous Trader Team" }]
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.1",
    "ruamel.yaml>=0.18.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "httpx>=0.28.0",
    "websockets>=12.0.0",
    "tenacity>=9.0.0",
    "rich>=14.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=2.0.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
nifty-trader = "nifty_trader.cli:main"

[tool.setuptools.packages.find]
include = ["nifty_trader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
