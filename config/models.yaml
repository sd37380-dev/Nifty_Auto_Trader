# ==============================================================================
# NIFTY Autonomous Trader — Model Router Configuration
# ==============================================================================
# Defines task tiers, primary AI model assignments, and automatic fallback chains.

routing:
  fast_observe:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.1
    fallback:
      provider: gemini
      model: gemini-2.5-flash

  market_analysis:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.2
    fallback:
      provider: gemini
      model: gemini-2.5-flash

  setup_confirmation:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.1
    fallback:
      provider: gemini
      model: gemini-2.5-flash

  research:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.3
    fallback:
      provider: gemini
      model: gemini-2.5-flash

  post_mortem:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.2
    fallback:
      provider: gemini
      model: gemini-2.5-flash

  strategy_improvement:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.3
    fallback:
      provider: gemini
      model: gemini-2.5-flash

providers:
  nvidia:
    api_key_env: NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    default_model: nvidia/nemotron-3-ultra-550b-a55b

  gemini:
    api_key_env: GEMINI_API_KEY
    default_model: gemini-2.5-flash

  openrouter:
    api_key_env: OPENROUTER_API_KEY
    default_model: nvidia/nemotron-3-ultra-550b-a55b

  openai:
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o

  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-3-5-sonnet-20241022

settings:
  cooldown_seconds: 60.0
