# ==============================================================================
# NIFTY Autonomous Trader — General, Risk & Browser Configuration
# ==============================================================================

app:
  name: "NIFTY Autonomous Trader"
  version: "0.1.0"
  mode: "RESEARCH" # "RESEARCH", "PAPER", or "LIVE" (disabled in early phases)

market:
  symbol: "NIFTY"
  timeframes:
    context: "1h"
    setup: "15m"
  timezone: "Asia/Kolkata"
  trading_hours:
    pre_market: "08:45"
    open: "09:15"
    last_entry: "14:30"
    intraday_square_off: "15:15"
    close: "15:30"

market_data:
  provider: "yahoo"
  symbol: "NIFTY"
  cache_db: "data/market/market_cache.db"
  cross_check_tolerance_pct: 0.5
  sync_count_1h: 100
  sync_count_15m: 100

market_observation:
  sources:
    tradingview:
      enabled: true
    sensibull:
      enabled: true
      url: "https://web.sensibull.com/option-chain?tradingsymbol=NIFTY"
      max_retries: 2
      timeout_seconds: 30
    numerical:
      enabled: true
  planner:
    automatic_observation: true
  cross_check:
    match_tolerance_pct: 0.5
    minor_tolerance_pct: 1.5

# Configurable safety-policy constraints
risk:
  max_risk_per_trade: 0.01           # Max 1.0% account equity risked on single trade
  max_portfolio_daily_loss: 2000.0   # Hard stop if cumulative portfolio session loss reaches ₹2,000
  max_daily_loss: 2000               # Maintained for backward compatibility (₹2,000 portfolio daily cap)
  max_lots_per_trade: 1              # Strictly 1 lot allowed per trade
  max_concurrent_instruments: 1      # Only 1 instrument traded at a time
  max_concurrent_positions: 1        # Max 1 open position at a time
  max_trades_per_day: 3              # Max 3 trades allowed per trading session
  minimum_rr: 3.0                    # Minimum 1:3 Risk-to-Reward ratio for proposed trade plans
  instruments:
    NIFTY:
      max_trades_per_day: 3          # Max 3 trades per day for NIFTY
      max_daily_loss: 1000.0         # Max ₹1,000 loss per day for NIFTY
      lot_size: 65                   # 1 lot = 65 qty (pieces)
      max_lots: 1                    # Exactly 1 lot per trade
      minimum_rr: 3.0                # Minimum 1:3 Risk-to-Reward ratio
    BANKNIFTY:
      max_trades_per_day: 3          # Max 3 trades per day for BANKNIFTY
      max_daily_loss: 1000.0         # Max ₹1,000 loss per day for BANKNIFTY
      lot_size: 30                   # 1 lot = 30 qty (pieces)
      max_lots: 1                    # Exactly 1 lot per trade
      minimum_rr: 3.0                # Minimum 1:3 Risk-to-Reward ratio

browser:
  provider: hermes
  chrome_path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  headless: true
  remote_port: 9225
  navigation_timeout_seconds: 30
  element_timeout_seconds: 10
  max_action_retries: 2
  restart_on_disconnect: true

  screenshots:
    enabled: true
    directory: "data/browser/screenshots"
    retention_days: 7

  extraction:
    max_visible_text_chars: 12000
    max_dom_elements: 300
    max_links: 100

logging:
  level: "INFO"
  log_dir: "logs"
  retention_days: 30

autonomous:
  enabled: true
  max_cycles: 100
  max_observation_requests: 20
  max_model_calls: 50
  max_consecutive_failures: 5
  max_session_duration_minutes: 390
  waiting:
    minimum_seconds: 5.0
    maximum_seconds: 3600.0
  cooldown:
    default_seconds: 30.0
    sensibull_seconds: 60.0
    tradingview_seconds: 30.0
  recovery:
    restore_after_restart: true

change_detection:
  candle_completion: true
  source_refresh: true
  structure_change: true
  price_change:
    enabled: true
    minimum_relative_change: 0.001

# NIFTY Futures Short Strategy Configuration
short_strategy:
  max_resistance_distance: 20.0
  ema_distance_atr_multiplier: 0.25
  ema_fast: 20
  ema_trend: 50
  atr_period: 14
  sl_buffer: 5.0
  risk_reward: 2.0
  slippage_points: 1.0
  session_end: "15:00"
  one_position_only: true

