# ==============================================================================
# Render.com Blueprint Infrastructure-as-Code Specification
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: nifty-autonomous-trader
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: python -m nifty_trader.cli dashboard --host 0.0.0.0 --port $PORT --no-open
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
